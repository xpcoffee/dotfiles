# ============================================================
# Hyprland keybinding overrides for cross-OS consistency with
# the Windows komorebi/whkd setup.
#
# NOTE: the two sides use DIFFERENT MODIFIERS. This side keeps
# Super (omarchy's default); the Windows side uses Alt. Windows
# reserves Win+L (lock) and Win+H (voice typing) below the level
# whkd's keyboard hook can intercept, so a Super-keyed komorebi
# setup produces hotkeys that silently do the wrong thing. See
# ../komorebi/README.md.
#
# What still matches is the LAYOUT of the bindings -- hjkl to
# focus, +Shift to move, numbers for workspaces -- so only the
# modifier finger changes between machines.
#
# omarchy already ships sane Super defaults (Super+1-4
# workspaces, Super+Arrow focus, Super+Shift+Arrow move,
# Super+Tab / Super+Shift+Tab / Super+Ctrl+Tab for workspace
# cycling, Super+F fullscreen, Super+T float, Super+Q/W close),
# so this file only ADDS what omarchy doesn't bind by default:
# vim-style hjkl alongside the arrow keys, workspaces 5-9, and
# the "quick toggle to previously focused tile" binding.
#
# Per the omarchy manual: user overrides go in
# ~/.config/hypr/bindings.lua (or an included bindings.conf) so
# they survive `omarchy-update`. Drop this file's contents in
# there, or `source` this file from it, whichever your omarchy
# version expects -- check `~/.config/hypr/bindings.lua` for the
# current convention before pasting, since the exact user-config
# mechanism has changed across omarchy versions.
# ============================================================

$mainMod = SUPER

# --- vim-style focus movement (mirrors Super+Arrow) ----------
bindd = $mainMod, h, Focus left,  movefocus, l
bindd = $mainMod, j, Focus down,  movefocus, d
bindd = $mainMod, k, Focus up,    movefocus, u
bindd = $mainMod, l, Focus right, movefocus, r

# --- vim-style move (mirrors Super+Shift+Arrow) ---------------
bindd = $mainMod SHIFT, h, Move left,  movewindow, l
bindd = $mainMod SHIFT, j, Move down,  movewindow, d
bindd = $mainMod SHIFT, k, Move up,    movewindow, u
bindd = $mainMod SHIFT, l, Move right, movewindow, r

# --- quick toggle to the previously focused tile ---------------
# Same physical key as the Windows side: backtick/grave, just
# left of "1". Matches komorebi's `cycle-focus previous` used
# for the terminal <-> browser back-and-forth.
bindd = $mainMod, grave, Toggle to previous tile, focuscurrentorlast

# --- workspaces 5-9 (omarchy ships 1-4 by default) --------------
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9

bindd = $mainMod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to workspace 9, movetoworkspace, 9

# Everything else (Tab/Shift+Tab/Ctrl+Tab workspace cycling, F for
# fullscreen, T for float, Q/W close, Space for the app menu) is
# already omarchy's default and needs no change.
