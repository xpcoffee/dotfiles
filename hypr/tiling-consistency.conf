# ============================================================
# Hyprland keybinding and window-rule overrides for cross-OS
# consistency with the Windows komorebi/whkd setup.
#
# NOTE: the two sides use DIFFERENT MODIFIERS. This side keeps
# Super (omarchy's default); the Windows side uses Alt. Windows
# reserves Win+L (lock) and Win+H (voice typing) below the level
# whkd's keyboard hook can intercept, so a Super-keyed komorebi
# setup produces hotkeys that silently do the wrong thing. See
# ../komorebi/README.md.
#
# What still matches is the LAYOUT of the bindings -- hjkl to
# focus, +Shift to move, numbers for workspaces -- so only the
# modifier finger changes between machines.
#
# omarchy already ships sane Super defaults (Super+1-4
# workspaces, Super+Arrow focus, Super+Shift+Arrow move,
# Super+Tab / Super+Shift+Tab / Super+Ctrl+Tab for workspace
# cycling, Super+F fullscreen, Super+T float, Super+Q/W close),
# so this file only ADDS what omarchy doesn't ship by default:
# vim-style hjkl alongside the arrow keys, workspaces 5-9, the
# "quick toggle to previously focused tile" binding, and the
# workspace routing rules at the end of the file.
#
# Per the omarchy manual: user overrides go in
# ~/.config/hypr/bindings.lua (or an included bindings.conf) so
# they survive `omarchy-update`. Drop this file's contents in
# there, or `source` this file from it, whichever your omarchy
# version expects -- check `~/.config/hypr/bindings.lua` for the
# current convention before pasting, since the exact user-config
# mechanism has changed across omarchy versions.
# ============================================================

$mainMod = SUPER

# --- vim-style focus movement (mirrors Super+Arrow) ----------
bindd = $mainMod, h, Focus left,  movefocus, l
bindd = $mainMod, j, Focus down,  movefocus, d
bindd = $mainMod, k, Focus up,    movefocus, u
bindd = $mainMod, l, Focus right, movefocus, r

# --- vim-style move (mirrors Super+Shift+Arrow) ---------------
bindd = $mainMod SHIFT, h, Move left,  movewindow, l
bindd = $mainMod SHIFT, j, Move down,  movewindow, d
bindd = $mainMod SHIFT, k, Move up,    movewindow, u
bindd = $mainMod SHIFT, l, Move right, movewindow, r

# --- quick toggle to the previously focused tile ---------------
# Same physical key as the Windows side: backtick/grave, just
# left of "1". Matches komorebi's `cycle-focus previous` used
# for the terminal <-> browser back-and-forth.
bindd = $mainMod, grave, Toggle to previous tile, focuscurrentorlast

# --- workspaces 5-9 (omarchy ships 1-4 by default) --------------
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9

bindd = $mainMod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to workspace 9, movetoworkspace, 9

# Everything else (Tab/Shift+Tab/Ctrl+Tab workspace cycling, F for
# fullscreen, T for float, Q/W close, Space for the app menu) is
# already omarchy's default and needs no change.

# ============================================================
# Workspace routing
#
# Workspaces 1-4 have a theme and the most-used apps open on
# them automatically. 5-9 are unassigned scratch space. The same
# four themes are set up on the Windows side, via
# `workspace_rules` in ../komorebi/komorebi.json:
#
#   1  Comms
#   2  Reading & research
#   3  Coding / technical
#   4  Recreational
#
# The apps differ per OS, the numbers do not, so "comms is on 1"
# holds on either machine.
#
# BEHAVIOUR DIFFERS FROM THE WINDOWS SIDE. Hyprland applies a
# workspace rule when the window opens and then leaves it alone,
# so dragging a window to another workspace sticks. komorebi's
# `workspace_rules` re-send a matching window every time, so the
# same drag is undone. Hyprland has no equivalent of the
# permanent form; the closest komorebi equivalent of what this
# file does is `initial_workspace_rules`.
#
# Classes below are anchored with ^...$ on purpose. Hyprland
# matches a rule regex anywhere in the class unless anchored, and
# Chromium web apps carry classes of the form
# `chrome-<domain>__-Default`, so an unanchored `chromium` rule
# would capture every web app as well as the browser.
#
# To find the class for an app not listed here: open it, then run
# `hyprctl clients` and read the `class` field of its entry.
#
# The `match:class` form below is what omarchy's own rules use on
# current versions. Older Hyprland spells the same thing
# `windowrule = workspace 1 silent, class:^(Slack)$`. If these
# rules do nothing after a reload, check which form the rest of
# ~/.config/hypr uses and match it.
# ============================================================

# --- 1: comms -------------------------------------------------
windowrule = workspace 1 silent, match:class ^(Slack|discord|signal)$

# WhatsApp and Teams are Chromium web apps here rather than
# native clients, so they match on the web app class rather than
# on a binary name. Confirm the exact strings with
# `hyprctl clients` before trusting these -- the domain in the
# class changes if the app is re-added from a different URL.
windowrule = workspace 1 silent, match:class ^(chrome-web\.whatsapp\.com__-Default)$
windowrule = workspace 1 silent, match:class ^(chrome-teams\.microsoft\.com__-Default)$

# --- 2: reading & research ------------------------------------
windowrule = workspace 2 silent, match:class ^(chromium)$

# --- 3: coding / technical ------------------------------------
# Any of omarchy's four supported terminals, plus VS Code.
# Neovim runs inside a terminal, so it needs no rule of its own.
windowrule = workspace 3 silent, match:class ^(Alacritty|kitty|com\.mitchellh\.ghostty|foot)$
windowrule = workspace 3 silent, match:class ^(Code|code-oss)$

# --- 4: recreational ------------------------------------------
windowrule = workspace 4 silent, match:class ^(Spotify|steam)$
